<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday 🎉</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container" style="text-align:center;">
<h1>
  Happy Birthday Mahi (mahu pie 🍰)
  <br>
  <span style="font-size: 1.5rem;">💖</span>
</h1>


    <p style="margin-top:20px;">
  Wishing you the brightest smiles, warmest moments,
  and a birthday as sweet and special as you, Mahi 💖
    </p>

<button id="playBtn"
        style="margin-top:30px;padding:14px 28px;border-radius:999px;
               border:none;font-size:16px;cursor:pointer;">
  ▶ Tap to play music
</button>

  <div class="photo-grid">
  <img src="img/p1.jpg" alt="Mahi photo 1" class="photo p1">
  <img src="img/p2.jpg" alt="Mahi photo 2" class="photo p2">
  <img src="img/p3.jpg" alt="Mahi photo 3" class="photo p3">
  <img src="img/p4.jpg" alt="Mahi photo 4" class="photo p4">
</div>

    
<audio id="bg-music" preload="auto">
  <source src="audio/birthday.mp3" type="audio/mpeg">
</audio>

  </div>

<script>
  const btn = document.getElementById('playBtn');
  const music = document.getElementById('bg-music');

  btn.addEventListener('click', () => {
    music.volume = 1;
    music.play().then(() => {
      btn.style.display = 'none';
    });
  });
</script>

</body>
</html>
